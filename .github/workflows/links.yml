name: Markdown link check

on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.mdc"
      - ".github/workflows/links.yml"
      - ".lycheeignore"
  schedule:
    # Weekly catch for external link rot. Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    outputs:
      # Scheduled runs set `fail: false`, so the job succeeds even with broken
      # links; the exit code is what signals the issue job.
      broken: ${{ steps.lychee.outputs.exit_code != '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Cache speeds up incremental runs and is gentle on third-party hosts.
          # Verbose for human-readable PR annotations; format md for the issue body.
          # --remap: our docs use absolute github.com/.../blob/<branch>/ URLs (relative
          # links don't render in the GitHub wiki mirror). Resolving them against the live
          # branch makes any PR that renames/adds a referenced file 404 until it lands on
          # that branch. Remapping self-links to the checked-out tree validates the PR's
          # own state instead, and skips rate-limited round-trips to github.com.
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --verbose
            --format markdown
            --accept 200,206,429
            --remap "https://github.com/Enovatr-Labs/SpecRoute/blob/(main|develop)/ file://${GITHUB_WORKSPACE}/"
            --remap "https://github.com/Enovatr-Labs/SpecRoute/tree/(main|develop)/ file://${GITHUB_WORKSPACE}/"
            './**/*.md'
            './**/*.mdc'
          fail: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report for the issue job
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lychee-report
          path: lychee/out.md
          retention-days: 7

  # A separate job so `issues: write` is never held by the job that runs
  # third-party link-checking code over repository content.
  report:
    name: open issue on scheduled failure
    needs: lychee
    if: github.event_name == 'schedule' && needs.lychee.outputs.broken == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lychee-report
          path: lychee

      - name: Open issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Link check failed (scheduled run)"
          content-filepath: ./lychee/out.md
          labels: |
            link-rot
            triage
