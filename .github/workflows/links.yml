name: Markdown link check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdc"
      - ".github/workflows/links.yml"
      - ".lycheeignore"
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.mdc"
      - ".github/workflows/links.yml"
      - ".lycheeignore"
  schedule:
    # Weekly catch for external link rot. Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Cache speeds up incremental runs and is gentle on third-party hosts.
          # Verbose for human-readable PR annotations; format md for the issue body.
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --verbose
            --format markdown
            --accept 200,206,429
            './**/*.md'
            './**/*.mdc'
          fail: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check failed (scheduled run)"
          content-filepath: ./lychee/out.md
          labels: |
            link-rot
            triage
