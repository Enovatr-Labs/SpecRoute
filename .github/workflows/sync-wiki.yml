name: Sync wiki

# Publishes the contents of wiki/ to the GitHub wiki repo
# (https://github.com/<owner>/<repo>.wiki.git) on every push to main
# that touches wiki/**. The wiki/ directory in this repo is the source of truth;
# edits made directly in the wiki UI will be overwritten on the next sync.
#
# Prerequisite: the wiki must exist (create the Home page once via the wiki UI
# at https://github.com/<owner>/<repo>/wiki). Until then the .wiki.git endpoint
# does not exist to clone.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Push wiki/ to the wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          WIKI_REMOTE="https://github.com/${REPOSITORY}.wiki.git"
          # Send the token as a per-command header rather than embedding it in
          # the remote URL, where it would persist in wiki-repo/.git/config.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${AUTH_HEADER#AUTHORIZATION: basic }"
          git_auth() { git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" "$@"; }

          # Clone the wiki repo (separate from this one).
          git_auth clone "${WIKI_REMOTE}" wiki-repo

          # Sync wiki/ → wiki-repo/ exactly. --delete removes pages no longer
          # present in wiki/. We exclude .git and the local-only README.md.
          # --checksum: compare by content hash, not size+mtime. Both repos are
          # freshly checked out in the same second, so files share an mtime; a
          # same-length edit (e.g. a date 2026-06-16 -> 2026-06-29) would
          # otherwise be skipped by rsync's default quick-check and never sync.
          rsync -av --delete --checksum \
            --exclude='.git' \
            --exclude='README.md' \
            wiki/ wiki-repo/

          cd wiki-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to sync."
            exit 0
          fi

          git commit -m "Sync wiki from ${REPOSITORY}@${SOURCE_SHA}"
          git_auth push origin HEAD
